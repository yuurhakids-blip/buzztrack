services:
  # ─── Production ───────────────────────────────────────────────
  buzztrack:
    image: buzztrack:latest
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=22
    container_name: buzztrack
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PORT=3001
      - APP_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TWITTER_COOKIES=${TWITTER_COOKIES:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TIKTOK_MS_TOKEN=${TIKTOK_MS_TOKEN:-}
      - DISABLE_PYTHON_SCRAPERS=false
    volumes:
      - buzztrack_data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    labels:
      - "org.opencontainers.image.title=BuzzTrack"
      - "com.docker.compose.project=buzztrack"
      - "com.docker.compose.watch=true"
    networks:
      - buzztrack_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/campaigns',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    restart: always
    command: --label-enable --cleanup buzztrack

volumes:
  buzztrack_data:

networks:
  buzztrack_net:
    driver: bridge

  # ─── Development (hot-reload) ─────────────────────────────