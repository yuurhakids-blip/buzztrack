services:
  # ─── Production ───────────────────────────────────────────
  buzztrack:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=22
    container_name: buzztrack
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PORT=3001
      - APP_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TWITTER_COOKIES=${TWITTER_COOKIES:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TIKTOK_MS_TOKEN=${TIKTOK_MS_TOKEN:-}
      - DISABLE_PYTHON_SCRAPERS=${DISABLE_PYTHON_SCRAPERS:-}
    volumes:
      # Persist data across container restarts
      - buzztrack_data:/app/data
      # Mount .env for local config (optional)
      - ./.env:/app/.env
    restart: unless-stopped
    labels:
      - "org.opencontainers.image.title=BuzzTrack"
      - "com.docker.compose.project=buzztrack"
    networks:
      - buzztrack_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/campaigns',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Development (hot-reload) ─────────────────────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: buzztrack-dev
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_PORT=3001
      - DISABLE_HMR=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TWITTER_COOKIES=${TWITTER_COOKIES:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TIKTOK_MS_TOKEN=${TIKTOK_MS_TOKEN:-}
      - DISABLE_PYTHON_SCRAPERS=${DISABLE_PYTHON_SCRAPERS:-}
    volumes:
      # Mount source for hot-reload
      - ./server.ts:/app/server.ts:ro
      - ./src:/app/src:ro
      - ./scrapers:/app/scrapers:ro
      - ./data:/app/data
      - ./.env:/app/.env:ro
      # Exclude node_modules from bind mount
      - /app/node_modules
    command: npx concurrently -k "tsx server.ts" "vite"
    restart: unless-stopped
    networks:
      - buzztrack_net

volumes:
  buzztrack_data:

networks:
  buzztrack_net:
    driver: bridge
